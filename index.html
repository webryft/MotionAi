<style>
/* ============================================================
   MOTION AI — DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#000000;
  --panel:#0a0a0c;
  --panel-2:#111114;
  --line:rgba(255,255,255,0.09);
  --line-soft:rgba(255,255,255,0.05);
  --text:#f5f5f7;
  --muted:#8b8b92;
  --muted-2:#5c5c63;
  --violet:#7c5cff;
  --cyan:#22d3ee;
  --grad: linear-gradient(120deg,var(--violet),var(--cyan));
  --danger:#ff5470;
  --ok:#2dd4a7;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --ease: cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:'Inter',system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.display{font-family:'Space Grotesk',Inter,sans-serif}
button{font-family:inherit}
::selection{background:var(--violet);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#232326;border-radius:8px}
a{color:inherit}
input,textarea{font-family:inherit}

.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);display:flex;flex-direction:column}

/* ---------- Topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(0,0,0,0.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.icon-btn{background:transparent;border:none;color:var(--text);display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;cursor:pointer;transition:background .18s var(--ease)}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn:active{transform:scale(.94)}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center}
.brand-mark svg{width:15px;height:15px}
.brand-name{font-weight:700;font-size:16.5px;letter-spacing:-.02em}
.topbar-right{display:flex;align-items:center;gap:8px}
.credit-pill{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);padding:6px 11px 6px 8px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .18s}
.credit-pill:hover{border-color:rgba(255,255,255,.22)}
.credit-pill svg{width:15px;height:15px;color:var(--cyan)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--panel-2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;overflow:hidden}

/* ---------- Drawer ---------- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.drawer-backdrop.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:320px;background:linear-gradient(180deg,#0d0d10,#000);z-index:90;transform:translateX(-104%);transition:transform .32s var(--ease);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;padding:18px 14px}
.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:6px 6px 18px}
.drawer-head .avatar{width:42px;height:42px;font-size:15px}
.drawer-user-name{font-weight:600;font-size:14.5px}
.drawer-user-email{font-size:12px;color:var(--muted)}
.drawer-nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.drawer-link{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;color:var(--text);text-decoration:none;background:transparent;border:none;cursor:pointer;font-size:14.5px;font-weight:500;text-align:left;transition:background .16s}
.drawer-link:hover{background:var(--panel-2)}
.drawer-link.active{background:var(--panel-2);color:#fff}
.drawer-link svg{width:19px;height:19px;color:var(--muted);flex-shrink:0}
.drawer-link.active svg{color:var(--cyan)}
.drawer-sep{height:1px;background:var(--line-soft);margin:12px 4px}
.drawer-foot{margin-top:auto;padding:10px 6px}

/* ---------- Views ---------- */
.view{display:none;flex:1;flex-direction:column;animation:viewIn .32s var(--ease)}
.view.active{display:flex}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* ---------- Auth / Landing ---------- */
.hero{position:relative;margin:16px 16px 0;border-radius:var(--radius-lg);overflow:hidden;background:
  radial-gradient(120% 140% at 20% 0%, rgba(124,92,255,.35), transparent 55%),
  radial-gradient(120% 140% at 90% 100%, rgba(34,211,238,.28), transparent 55%),
  #08080a;
  padding:38px 22px 34px;border:1px solid var(--line)}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:14px}
.hero h1{font-size:28px;line-height:1.12;margin:0 0 10px;letter-spacing:-.02em;font-weight:600}
.hero p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:32ch}
.auth-box{padding:20px 16px 30px;display:flex;flex-direction:column;gap:10px}
.btn{border:none;border-radius:12px;padding:14px 16px;font-weight:600;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .15s var(--ease),filter .15s var(--ease);width:100%}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--grad);color:#050505}
.btn-primary:hover{filter:brightness(1.08)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn-outline:hover{background:var(--panel-2)}
.btn-ghost{background:var(--panel-2);color:var(--text)}
.btn-ghost:hover{background:#1a1a1e}
.btn-danger{background:rgba(255,84,112,.12);color:var(--danger);border:1px solid rgba(255,84,112,.3)}
.btn-sm{padding:9px 13px;font-size:13px;width:auto}
.btn svg{width:17px;height:17px}
.auth-note{text-align:center;font-size:12.5px;color:var(--muted-2);margin-top:2px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted-2);font-size:12px;margin:4px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line-soft)}

/* ---------- Panels / cards ---------- */
.section{padding:18px 16px 4px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:17px;font-weight:600;letter-spacing:-.01em}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.input-wrap{position:relative}
.input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:12px 13px;border-radius:10px;font-size:14px;outline:none;transition:border-color .16s}
.input:focus{border-color:var(--violet)}
.input-wrap .input{padding-right:42px}
.input-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:8px;display:flex}
.input-eye svg{width:17px;height:17px}
.link-btn{background:none;border:none;color:var(--cyan);font-size:12.5px;cursor:pointer;padding:0;font-weight:500}

/* ---------- Tools grid ---------- */
.tools-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 6px}
.tool-card{position:relative;border-radius:var(--radius-md);overflow:hidden;background:var(--panel-2);border:1px solid var(--line);cursor:pointer;transition:transform .18s var(--ease),border-color .18s}
.tool-card:hover{border-color:rgba(255,255,255,.22);transform:translateY(-2px)}
.tool-card:active{transform:scale(.98)}
.tool-thumb{aspect-ratio:4/3;width:100%;background:linear-gradient(135deg,#151519,#0a0a0c);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.tool-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tool-thumb .fallback-icon{color:var(--muted-2)}
.tool-thumb .fallback-icon svg{width:30px;height:30px}
.tool-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);color:var(--muted);font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:999px;letter-spacing:.02em}
.tool-title{padding:9px 10px 11px;font-size:13px;font-weight:600}

/* ---------- Projects ---------- */
.projects-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 12px}
.btn-new{background:var(--grad);color:#050505;border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}
.btn-new svg{width:15px;height:15px}
.projects-list{display:flex;flex-direction:column;gap:10px;padding:0 16px 24px}
.project-card{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative}
.project-thumb{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#18181c,#0a0a0c);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted-2)}
.project-thumb img{width:100%;height:100%;object-fit:cover}
.project-thumb svg{width:22px;height:22px}
.project-meta{flex:1;min-width:0}
.project-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-date{font-size:11.5px;color:var(--muted);margin-top:3px}
.project-dots{background:none;border:none;color:var(--muted);cursor:pointer;padding:8px;flex-shrink:0}
.project-dots svg{width:18px;height:18px}
.empty-state{text-align:center;padding:44px 24px;color:var(--muted)}
.empty-state svg{width:38px;height:38px;color:var(--muted-2);margin-bottom:12px}
.empty-state p{font-size:13.5px;margin:0}

/* dropdown menu for project dots */
.dropdown{position:absolute;right:10px;top:48px;background:#151518;border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:20;min-width:140px;box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(-4px) scale(.97);pointer-events:none;transition:.15s var(--ease)}
.dropdown.show{opacity:1;transform:none;pointer-events:auto}
.dropdown button{width:100%;background:none;border:none;color:var(--text);padding:11px 13px;text-align:left;font-size:13px;display:flex;align-items:center;gap:9px;cursor:pointer}
.dropdown button:hover{background:var(--panel-2)}
.dropdown button svg{width:15px;height:15px;color:var(--muted)}
.dropdown button.danger{color:var(--danger)}
.dropdown button.danger svg{color:var(--danger)}

/* ---------- Tool workspace ---------- */
.workspace{padding:14px 16px 26px}
.ws-back{display:flex;align-items:center;gap:8px;color:var(--muted);background:none;border:none;font-size:13.5px;cursor:pointer;padding:6px 0 14px}
.ws-back svg{width:17px;height:17px}
.ws-title{font-size:19px;font-weight:600;margin:0 0 3px}
.ws-sub{font-size:13px;color:var(--muted);margin:0 0 18px}
.upload-zone{border:1.5px dashed var(--line);border-radius:var(--radius-md);padding:26px 16px;text-align:center;cursor:pointer;transition:border-color .18s,background .18s;background:var(--panel-2)}
.upload-zone:hover{border-color:var(--violet);background:#101014}
.upload-zone svg{width:26px;height:26px;color:var(--muted);margin-bottom:8px}
.upload-zone p{margin:0;font-size:13px;color:var(--muted)}
.upload-zone span{color:var(--cyan);font-weight:600}
.upload-preview{position:relative;border-radius:var(--radius-md);overflow:hidden;background:#000}
.upload-preview img,.upload-preview video{width:100%;max-height:280px;object-fit:contain;display:block;background:#000}
.upload-remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.upload-remove svg{width:15px;height:15px}
.prompt-box{margin-top:14px}
.prompt-box textarea{width:100%;min-height:92px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px;font-size:14px;resize:vertical;outline:none;transition:border-color .16s}
.prompt-box textarea:focus{border-color:var(--violet)}
.cost-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--muted)}
.cost-row .cost-val{display:flex;align-items:center;gap:5px;color:var(--cyan);font-weight:600}
.cost-row svg{width:13px;height:13px}
.generate-bar{margin-top:16px}
.progress-track{height:8px;background:var(--panel-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress-fill{height:100%;width:0%;background:var(--grad);transition:width .25s linear}
.progress-label{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.camera-frame{border-radius:var(--radius-md);overflow:hidden;background:#000;border:1px solid var(--line);position:relative}
.camera-frame video,.camera-frame canvas{width:100%;display:block;max-height:340px;object-fit:cover}
.camera-controls{display:flex;justify-content:center;gap:14px;padding:16px 0 4px}
.shutter-btn{width:62px;height:62px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.25);cursor:pointer;display:flex;align-items:center;justify-content:center}
.shutter-btn.rec{background:var(--danger)}
.shutter-btn:active{transform:scale(.92)}
.coming-soon{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--muted)}
.coming-soon svg{width:40px;height:40px;color:var(--muted-2);margin-bottom:14px}
.coming-soon h3{margin:0 0 6px;font-size:16px;color:var(--text)}
.coming-soon p{margin:0;font-size:13px;max-width:26ch}

/* ---------- Credits / plans ---------- */
.plan-card{border:1px solid var(--line);background:var(--panel-2);border-radius:16px;padding:16px;margin-bottom:12px;position:relative;cursor:pointer;transition:border-color .18s,transform .18s}
.plan-card:hover{border-color:rgba(255,255,255,.25)}
.plan-card.featured{border-color:var(--violet);background:linear-gradient(160deg,rgba(124,92,255,.14),rgba(34,211,238,.06))}
.plan-top{display:flex;align-items:baseline;justify-content:space-between}
.plan-name{font-size:15px;font-weight:700}
.plan-price{font-size:17px;font-weight:700}
.plan-price small{font-size:11px;color:var(--muted);font-weight:500}
.plan-credits{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--cyan);font-weight:600}
.plan-credits svg{width:14px;height:14px}
.plan-tag{position:absolute;top:-9px;right:14px;background:var(--grad);color:#050505;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px}
.plan-cta{margin-top:12px;width:100%}
.credits-zero-banner{margin:0 16px 14px;background:rgba(255,84,112,.08);border:1px solid rgba(255,84,112,.25);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.credits-zero-banner svg{width:17px;height:17px;color:var(--danger);flex-shrink:0;margin-top:1px}
.credits-zero-banner p{margin:0;font-size:12.5px;color:var(--text);line-height:1.45}
.credits-zero-banner b{color:var(--danger)}

/* ---------- Modal system ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.modal-backdrop.show{opacity:1;pointer-events:auto}
@media (min-width:520px){.modal-backdrop{align-items:center}}
.modal-card{width:100%;max-width:420px;background:linear-gradient(180deg,#111114,#08080a);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 18px 26px;transform:translateY(24px);transition:transform .3s var(--ease);max-height:88vh;overflow-y:auto}
@media (min-width:520px){.modal-card{border-radius:20px;transform:translateY(12px) scale(.97)}}
.modal-backdrop.show .modal-card{transform:none}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:999px;margin:0 auto 16px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h3{margin:0;font-size:17px;font-weight:600}
.modal-close{background:var(--panel-2);border:none;color:var(--muted);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close svg{width:15px;height:15px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}
.modal-icon-badge{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.modal-icon-badge svg{width:26px;height:26px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#151518;border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:500;z-index:400;opacity:0;pointer-events:none;transition:.28s var(--ease);display:flex;align-items:center;gap:9px;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;flex-shrink:0}
.toast.ok svg{color:var(--ok)}
.toast.err svg{color:var(--danger)}

/* loader ring */
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ad slot */
.ad-slot{margin:18px 16px 6px;border:1px solid var(--line-soft);border-radius:12px;padding:8px;background:var(--panel-2);overflow:hidden}
.ad-slot-label{font-size:10px;color:var(--muted-2);text-align:center;margin-bottom:4px;letter-spacing:.03em}

.hidden{display:none !important}
</style>
</head>

function icon(name,cls){ return `<span class="${cls||''}">${ICONS[name]||''}</span>`; }

/* ============================================================
   TOAST
   ============================================================ */
const toastEl = document.getElementById('toast');
function toast(msg, type='ok'){
  toastEl.className = 'toast show ' + type;
  toastEl.innerHTML = (type==='err'? ICONS.alert : ICONS.check) + `<span>${msg}</span>`;
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=> toastEl.classList.remove('show'), 2600);
}

/* ============================================================
   MODAL SYSTEM
   ============================================================ */
const modalBackdrop = document.getElementById('modalBackdrop');
const modalCard = document.getElementById('modalCard');
function openModal(html){
  modalCard.innerHTML = `<div class="modal-handle"></div>` + html;
  modalBackdrop.classList.add('show');
}
function closeModal(){ modalBackdrop.classList.remove('show'); }
modalBackdrop.addEventListener('click', (e)=>{ if(e.target === modalBackdrop) closeModal(); });

/* ============================================================
   DRAWER
   ============================================================ */
const drawer = document.getElementById('drawer');
const drawerBackdrop = document.getElementById('drawerBackdrop');
function openDrawer(){ drawer.classList.add('show'); drawerBackdrop.classList.add('show'); }
function closeDrawer(){ drawer.classList.remove('show'); drawerBackdrop.classList.remove('show'); }
document.getElementById('menuBtn').innerHTML = icon('menu');
document.getElementById('menuBtn').addEventListener('click', openDrawer);
drawerBackdrop.addEventListener('click', closeDrawer);

/* ============================================================
   VIEW SWITCHING
   ============================================================ */
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.drawer-link').forEach(l=> l.classList.toggle('active', l.dataset.view===name));
  window.scrollTo(0,0);
  closeDrawer();
}

/* ============================================================
   FIREBASE INIT
   ============================================================ */
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser = null;   // firebase auth user
let userDoc = null;       // firestore profile { credits, plan, username, email }
let projectsUnsub = null;

/* ============================================================
   AUTH VIEW SETUP
   ============================================================ */
document.getElementById('heroIcon').innerHTML = ICONS.sparkle + ` Ai video &amp; photo generation`;
const googleBtn = document.getElementById('googleBtn');
googleBtn.innerHTML = ICONS.google + `<span>Continue with Google</span>`;
googleBtn.addEventListener('click', async ()=>{
  const provider = new firebase.auth.GoogleAuthProvider();
  try{
    await auth.signInWithPopup(provider);
  }catch(err){ toast(err.message,'err'); }
});
document.getElementById('openLoginBtn').addEventListener('click', ()=> openLoginModal());
document.getElementById('openCreateBtn').addEventListener('click', ()=> openCreateModal());

function openLoginModal(){
  openModal(`
    <div class="modal-head"><h3>Log in</h3><button class="modal-close" onclick="closeModal()">${ICONS.close}</button></div>
    <div class="field"><label>Email</label><input class="input" id="li_email" type="email" placeholder="you@gmail.com"></div>
    <div class="field"><label>Password</label>
      <div class="input-wrap"><input class="input" id="li_pass" type="password" placeholder="Password">
      <button class="input-eye" type="button" onclick="togglePass('li_pass',this)">${ICONS.eye}</button></div>
    </div>
    <button class="link-btn" onclick="openForgotModal()">Forgot password?</button>
    <div class="modal-actions">
      <button class="btn btn-primary" id="li_submit">Log in</button>
    </div>
  `);
  document.getElementById('li_submit').addEventListener('click', doLogin);
}
function openCreateModal(){
  openModal(`
    <div class="modal-head"><h3>Create account</h3><button class="modal-close" onclick="closeModal()">${ICONS.close}</button></div>
    <div class="field"><label>Username</label><input class="input" id="ca_name" placeholder="Your name"></div>
    <div class="field"><label>Gmail address</label><input class="input" id="ca_email" type="email" placeholder="you@gmail.com"></div>
    <div class="field"><label>Password</label>
      <div class="input-wrap"><input class="input" id="ca_pass" type="password" placeholder="At least 6 characters">
      <button class="input-eye" type="button" onclick="togglePass('ca_pass',this)">${ICONS.eye}</button></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="ca_submit">Create account</button>
    </div>
  `);
  document.getElementById('ca_submit').addEventListener('click', doCreate);
}
function openForgotModal(){
  openModal(`
    <div class="modal-head"><h3>Reset password</h3><button class="modal-close" onclick="closeModal()">${ICONS.close}</button></div>
    <div class="field"><label>Registered Gmail</label><input class="input" id="fp_email" type="email" placeholder="you@gmail.com"></div>
    <div class="field"><label>New password you'd like</label>
      <div class="input-wrap"><input class="input" id="fp_pass" type="password" placeholder="New password">
      <button class="input-eye" type="button" onclick="togglePass('fp_pass',this)">${ICONS.eye}</button></div>
    </div>
    <p style="font-size:12px;color:var(--muted);margin:2px 0 0">We'll send this request to our admin team, who will verify your account and email your new password to your Gmail.</p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="fp_submit">Send request</button>
    </div>
  `);
  document.getElementById('fp_submit').addEventListener('click', doForgotPassword);
}
function togglePass(id, btn){
  const el = document.getElementById(id);
  const showing = el.type === 'text';
  el.type = showing ? 'password' : 'text';
  btn.innerHTML = showing ? ICONS.eye : ICONS.eyeOff;
}

async function doLogin(){
  const email = document.getElementById('li_email').value.trim();
  const pass = document.getElementById('li_pass').value;
  if(!email || !pass){ toast('Enter your email and password','err'); return; }
  const btn = document.getElementById('li_submit');
  btn.innerHTML = `<span class="spinner"></span>`;
  try{
    await auth.signInWithEmailAndPassword(email, pass);
    closeModal();
  }catch(err){ toast(mapAuthError(err),'err'); btn.textContent='Log in'; }
}
async function doCreate(){
  const name = document.getElementById('ca_name').value.trim();
  const email = document.getElementById('ca_email').value.trim();
  const pass = document.getElementById('ca_pass').value;
  if(!name || !email || !pass){ toast('Fill all fields','err'); return; }
  if(pass.length < 6){ toast('Password must be 6+ characters','err'); return; }
  const btn = document.getElementById('ca_submit');
  btn.innerHTML = `<span class="spinner"></span>`;
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({ displayName:name });
    await createUserDoc(cred.user, name);
    closeModal();
    setTimeout(()=> openWelcomeModal(), 400);
  }catch(err){ toast(mapAuthError(err),'err'); btn.textContent='Create account'; }
}
async function doForgotPassword(){
  const email = document.getElementById('fp_email').value.trim();
  const pass = document.getElementById('fp_pass').value;
  if(!email || !pass){ toast('Fill both fields','err'); return; }
  try{
    await db.collection('passwordResets').add({
      email, requestedPassword: pass, status:'pending',
      requestedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    toast('Request sent — check your Gmail soon');
  }catch(err){ toast(err.message,'err'); }
}
function mapAuthError(err){
  const m = { 'auth/user-not-found':'No account with that email','auth/wrong-password':'Incorrect password','auth/email-already-in-use':'That email is already registered','auth/invalid-email':'Invalid email address' };
  return m[err.code] || err.message;
}

function openWelcomeModal(){
  openModal(`
    <div class="modal-icon-badge" style="background:var(--grad);color:#050505">${ICONS.sparkle}</div>
    <h3 style="margin:0 0 6px">Welcome to Motion Ai</h3>
    <p style="font-size:13.5px;color:var(--muted);line-height:1.5;margin:0 0 4px">Your account starts with 0 credits. Subscribe to a plan to start generating video, photo and animation.</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Not now</button>
      <button class="btn btn-primary" onclick="closeModal();showView('credits')">View plans</button>
    </div>
  `);
}

/* ============================================================
   USER DOC (Firestore)
   ============================================================ */
async function createUserDoc(user, name){
  await db.collection('users').doc(user.uid).set({
    username: name || user.displayName || 'User',
    email: user.email,
    credits: NEW_USER_BONUS_CREDITS,
    plan: null,
    planExpiry: null,
    photoURL: user.photoURL || null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true });
}

auth.onAuthStateChanged(async (user)=>{
  currentUser = user;
  if(!user){
    userDoc = null;
    if(projectsUnsub) projectsUnsub();
    showView('auth');
    renderTopbar();
    renderDrawer();
    return;
  }
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  let isNew = false;
  if(!snap.exists){
    isNew = true;
    await createUserDoc(user, user.displayName);
  }
  ref.onSnapshot(s=>{
    userDoc = s.data();
    renderTopbar();
    renderDrawer();
    renderCreditsBanner();
    renderPlans();
  });
  renderToolsGrid();
  watchProjects(user.uid);
  showView('home');
  if(isNew) setTimeout(()=> openWelcomeModal(), 500);
});

document.getElementById('signOutBtn').addEventListener('click', async ()=>{
  await auth.signOut();
  toast('Signed out');
});

/* ============================================================
   TOPBAR + DRAWER RENDER
   ============================================================ */
function initials(str){
  if(!str) return 'U';
  return str.trim().split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();
}
function renderTopbar(){
  const right = document.getElementById('topbarRight');
  if(!currentUser){ right.innerHTML = ''; return; }
  const credits = userDoc ? userDoc.credits : 0;
  right.innerHTML = `
    <button class="credit-pill" id="creditPillBtn">${ICONS.coin}<span>${credits.toLocaleString()}</span></button>
    <div class="avatar" id="avatarBtn">${ initials(userDoc && userDoc.username || currentUser.displayName || currentUser.email) }</div>
  `;
  document.getElementById('creditPillBtn').addEventListener('click', ()=> showView('credits'));
  document.getElementById('avatarBtn').addEventListener('click', openDrawer);
}
function renderDrawer(){
  const head = document.getElementById('drawerHead');
  const nav = document.getElementById('drawerNav');
  if(!currentUser){ head.innerHTML=''; nav.innerHTML=''; document.getElementById('signOutBtn').classList.add('hidden'); return; }
  document.getElementById('signOutBtn').classList.remove('hidden');
  head.innerHTML = `
    <div class="avatar">${initials(userDoc && userDoc.username || currentUser.email)}</div>
    <div>
      <div class="drawer-user-name">${userDoc ? userDoc.username : (currentUser.displayName||'User')}</div>
      <div class="drawer-user-email">${currentUser.email}</div>
    </div>
  `;
  nav.innerHTML = `
    <button class="drawer-link" data-view="home" onclick="showView('home')">${ICONS.grid}<span>Projects</span></button>
    <button class="drawer-link" data-view="tools" onclick="scrollToTools()">${ICONS.motion}<span>Tools</span></button>
    <button class="drawer-link" data-view="credits" onclick="showView('credits')">${ICONS.wallet}<span>Buy credits</span></button>
    <div class="drawer-sep"></div>
    <button class="drawer-link" onclick="openDownloadAppModal()">${ICONS.download}<span>Download app</span></button>
  `;
}
function scrollToTools(){ showView('home'); }

/* ============================================================
   CREDITS BANNER (home view, when 0 credits)
   ============================================================ */
let bannerDismissed = false;
function renderCreditsBanner(){
  const el = document.getElementById('creditsBanner');
  if(!userDoc) { el.innerHTML=''; return; }
  if(userDoc.credits > 0 || bannerDismissed){ el.innerHTML=''; return; }
  el.innerHTML = `
    <div class="credits-zero-banner" style="position:relative;padding-right:34px">
      ${ICONS.alert}
      <p><b>You're out of credits.</b> Buy a plan to generate video, photo or animation. Browsing tools and projects is always free.</p>
      <button onclick="bannerDismissed=true; renderCreditsBanner();" style="position:absolute;top:8px;right:8px;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex">${ICONS.close}</button>
    </div>`;
}
  

/* ============================================================
   DOWNLOAD APP MODAL
   ============================================================ */
function openDownloadAppModal(){
  closeDrawer();
  setTimeout(()=>{
    openModal(`

document.getElementById('newProjectBtn').innerHTML = ICONS.plus + `<span>New</span>`;

/* ============================================================
   PROJECTS
   ============================================================ */
function watchProjects(uid){
  if(projectsUnsub) projectsUnsub();
  projectsUnsub = db.collection('projects').where('uid','==',uid)
    .orderBy('createdAt','desc')
    .onSnapshot(renderProjects, err=>{ console.warn(err); });
}
function fmtDate(ts){
  if(!ts || !ts.toDate) return '';
  return ts.toDate().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function renderProjects(snap){
  const list = document.getElementById('projectsList');
  if(snap.empty){
    list.innerHTML = `<div class="empty-state">${ICONS.folder}<p>No projects yet. Tap + New or pick a tool above to create your first one.</p></div>`;
    return;
  }
  list.innerHTML = snap.docs.map(doc=>{
    const p = doc.data(); const id = doc.id;
    return `
    <div class="project-card">
      <div class="project-thumb">${p.thumbnail ? `<img src="${p.thumbnail}">` : (ICONS[p.thumbIcon||'film'])}</div>
      <div class="project-meta">
        <div class="project-title">${escapeHtml(p.title||'Untitled project')}</div>
        <div class="project-date">${fmtDate(p.createdAt)} · ${escapeHtml(p.toolLabel||'')}</div>
      </div>
      <button class="project-dots" onclick="toggleProjectMenu(event,'${id}')">${ICONS.dots}</button>
      <div class="dropdown" id="dd-${id}">
        <button onclick="renameProject('${id}','${escapeHtml(p.title||'')}')">${ICONS.edit}<span>Rename</span></button>
        <button class="danger" onclick="deleteProject('${id}')">${ICONS.trash}<span>Delete</span></button>
      </div>
    </div>`;
  }).join('');
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;'); }
let openDropdownId = null;
function toggleProjectMenu(e, id){
  e.stopPropagation();
  document.querySelectorAll('.dropdown.show').forEach(d=> d.classList.remove('show'));
  const dd = document.getElementById('dd-'+id);
  if(openDropdownId===id){ openDropdownId=null; return; }
  dd.classList.add('show'); openDropdownId = id;
}
document.addEventListener('click', ()=>{ document.querySelectorAll('.dropdown.show').forEach(d=> d.classList.remove('show')); openDropdownId=null; });

function renameProject(id, currentTitle){
  openModal(`
    <div class="modal-head"><h3>Rename project</h3><button class="modal-close" onclick="closeModal()">${ICONS.close}</button></div>
    <div class="field"><input class="input" id="rn_title" value="${currentTitle}"></div>
    <div class="modal-actions"><button class="btn btn-primary" id="rn_save">Save</button></div>
  `);
  document.getElementById('rn_save').addEventListener('click', async ()=>{
    const val = document.getElementById('rn_title').value.trim();
    if(!val) return;
    await db.collection('projects').doc(id).update({title:val});
    closeModal(); toast('Project renamed');
  });
}
function deleteProject(id){
  openModal(`
    <div class="modal-icon-badge" style="background:rgba(255,84,112,.12);color:var(--danger)">${ICONS.trash}</div>
    <h3 style="margin:0 0 6px">Delete this project?</h3>
    <p style="font-size:13.5px;color:var(--muted);margin:0">This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="del_confirm">Delete</button>
    </div>
  `);
  document.getElementById('del_confirm').addEventListener('click', async ()=>{
    await db.collection('projects').doc(id).delete();
    closeModal(); toast('Project deleted');
  });
}

/* ============================================================
   TOOL WORKSPACE
   ============================================================ */
const TOOL_MAP = Object.fromEntries(TOOLS.map(t=>[t.id,t]));
let wsState = { mediaBlobUrl:null, mediaKind:null, stream:null, recorder:null, chunks:[] };

function openTool(toolId){
  if(toolId!=='generate' && !TOOL_MAP[toolId]) return;
  wsState = { mediaBlobUrl:null, mediaKind:null, stream:null, recorder:null, chunks:[] };
  const tool = toolId==='generate'
    ? { id:'generate', title:'New generation', kind:'upload-any', costKey:'generate' }
    : Object.assign({costKey:toolId}, TOOL_MAP[toolId]);
  renderWorkspace(tool);
  showView('workspace');
}

function renderWorkspace(tool){
  const el = document.getElementById('workspaceInner');
  stopCameraIfAny();

  if(tool.kind==='soon'){
    el.innerHTML = `
      <button class="ws-back" onclick="showView('home')">${ICONS.back}<span>Back</span></button>
      <div class="coming-soon">${ICONS.avatar}<h3>Avatar coming soon</h3><p>We're finishing this tool up. Check back shortly.</p></div>
    `;
    return;
  }

  const cost = CREDIT_COST[tool.costKey] ?? CREDIT_COST.generate;
  const isCamera = tool.kind==='camera-video' || tool.kind==='camera-photo';

  el.innerHTML = `
    <button class="ws-back" onclick="showView('home')">${ICONS.back}<span>Back</span></button>
    <h2 class="ws-title">${tool.title}</h2>
    <p class="ws-sub">${workspaceSubtitle(tool)}</p>
    <div id="wsMediaArea"></div>
    <div class="prompt-box">
      <textarea id="ws_prompt" placeholder="Describe what you want Motion Ai to create..."></textarea>
    </div>
    <div class="cost-row">
      <span>Cost per generation</span>
      <span class="cost-val">${ICONS.coin}${cost.toLocaleString()} credits</span>
    </div>
    <div class="generate-bar">
      <button class="btn btn-primary" id="ws_generate">${ICONS.sparkle}<span>Generate</span></button>
      <div id="wsProgressWrap" class="hidden">
        <div class="progress-track"><div class="progress-fill" id="wsProgressFill"></div></div>
        <div class="progress-label" id="wsProgressLabel">Starting…</div>
      </div>
    </div>
  `;

  if(isCamera){
    renderCameraArea(tool);
  } else {
    renderUploadArea(tool);
  }

  document.getElementById('ws_generate').addEventListener('click', ()=> runGeneration(tool, cost));
}

function workspaceSubtitle(tool){
  switch(tool.id){
    case 'editVideo': return 'Upload a video, describe your edit, and let Motion Ai render it.';
    case 'editPhoto': return 'Upload a photo and describe the edit you want.';
    case 'editMotion': return 'Simulate motion — cycle and physics-style rendering, similar to a 3D engine.';
    case 'animation': return 'Turn a still photo into an animated video with your prompt.';
    case 'takeVideo': return 'Use your camera to record, then describe how to generate.';
    case 'takePhoto': return 'Use your camera to snap a photo, then describe how to generate.';
    case 'generate': return 'Describe anything — Motion Ai will generate video or image from scratch.';
    default: return 'Describe what you want to create.';
  }
}

function renderUploadArea(tool){
  const area = document.getElementById('wsMediaArea');
  const accept = tool.kind==='upload-video' ? 'video/*' : (tool.kind==='upload-photo' ? 'image/*' : 'video/*,image/*');
  area.innerHTML = `
    <div class="upload-zone" id="uploadZone">
      ${ICONS.image}
      <p><span>Tap to upload</span> ${tool.kind==='upload-video'?'a video':'a photo'}</p>
    </div>
    <input type="file" id="fileInput" accept="${accept}" class="hidden">
  `;
  const zone = document.getElementById('uploadZone');
  const input = document.getElementById('fileInput');
  zone.addEventListener('click', ()=> input.click());
  input.addEventListener('change', ()=>{
    const f = input.files[0]; if(!f) return;
    const url = URL.createObjectURL(f);
    wsState.mediaBlobUrl = url; wsState.mediaKind = f.type.startsWith('video')?'video':'image';
    area.innerHTML = `
      <div class="upload-preview">
        ${wsState.mediaKind==='video' ? `<video src="${url}" controls></video>` : `<img src="${url}">`}
        <button class="upload-remove" onclick="clearMedia('${tool.id}')">${ICONS.close}</button>
      </div>`;
  });
}
function clearMedia(toolId){ openTool(toolId); }

function renderCameraArea(tool){
  const area = document.getElementById('wsMediaArea');
  const isVideo = tool.kind==='camera-video';
  area.innerHTML = `
    <div class="camera-frame">
      <video id="camPreview" autoplay playsinline muted></video>
    </div>
    <div class="camera-controls">
      <button class="shutter-btn" id="shutterBtn"></button>
    </div>
  `;
  startCamera(isVideo);
}
async function startCamera(isVideo){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:isVideo });
    wsState.stream = stream;
    const vid = document.getElementById('camPreview');
    vid.srcObject = stream;
    const shutter = document.getElementById('shutterBtn');
    if(isVideo){
      let recording = false;
      shutter.addEventListener('click', ()=>{
        if(!recording){
          wsState.chunks = [];
          const rec = new MediaRecorder(stream);
          rec.ondataavailable = e=> wsState.chunks.push(e.data);
          rec.onstop = ()=>{
            const blob = new Blob(wsState.chunks, {type:'video/webm'});
            wsState.mediaBlobUrl = URL.createObjectURL(blob); wsState.mediaKind='video';
            showCapturedPreview();
          };
          rec.start(); wsState.recorder = rec; recording = true;
          shutter.classList.add('rec');
        } else {
          wsState.recorder.stop(); recording = false; shutter.classList.remove('rec');
        }
      });
    } else {
      shutter.addEventListener('click', ()=>{
        const vid2 = document.getElementById('camPreview');
        const canvas = document.createElement('canvas');
        canvas.width = vid2.videoWidth; canvas.height = vid2.videoHeight;
        canvas.getContext('2d').drawImage(vid2,0,0);
        canvas.toBlob(blob=>{
          wsState.mediaBlobUrl = URL.createObjectURL(blob); wsState.mediaKind='image';
          showCapturedPreview();
        }, 'image/jpeg', 0.92);
      });
    }
  }catch(err){
    document.getElementById('wsMediaArea').innerHTML = `<div class="credits-zero-banner">${ICONS.alert}<p>Camera access was blocked or unavailable. Allow camera permission and try again.</p></div>`;
  }
}
function stopCameraIfAny(){
  if(wsState.stream){ wsState.stream.getTracks().forEach(t=>t.stop()); wsState.stream=null; }
}
function showCapturedPreview(){
  stopCameraIfAny();
  const area = document.getElementById('wsMediaArea');
  area.innerHTML = `
    <div class="upload-preview">
      ${wsState.mediaKind==='video' ? `<video src="${wsState.mediaBlobUrl}" controls></video>` : `<img src="${wsState.mediaBlobUrl}">`}
      <button class="upload-remove" onclick="showView('workspace')">${ICONS.close}</button>
    </div>`;
}

/* ============================================================
   GENERATE (simulated render pipeline — wire your real API here)
   ============================================================ */
async function runGeneration(tool, cost){
  const promptVal = document.getElementById('ws_prompt').value.trim();
  if(!promptVal){ toast('Describe what you want to generate','err'); return; }
  if(!userDoc || userDoc.credits < cost){ openInsufficientCreditsModal(); return; }

  const btn = document.getElementById('ws_generate');
  const wrap = document.getElementById('wsProgressWrap');
  const fill = document.getElementById('wsProgressFill');
  const label = document.getElementById('wsProgressLabel');
  btn.classList.add('hidden'); wrap.classList.remove('hidden');

  let pct = 0;
  const timer = setInterval(()=>{
    pct = Math.min(pct + Math.random()*14 + 6, 97);
    fill.style.width = pct+'%';
    label.textContent = pct < 40 ? 'Analyzing prompt…' : pct < 75 ? 'Rendering…' : 'Finalizing…';
  }, 260);

  // -----------------------------------------------------------
  // TODO: replace this block with your real generation API call.
  // -----------------------------------------------------------
  await new Promise(res=> setTimeout(res, 2600));

  clearInterval(timer);
  fill.style.width = '100%';
  label.textContent = 'Done';

  try{
    await db.collection('projects').add({
      uid: currentUser.uid,
      title: promptVal.slice(0,60),
      toolLabel: tool.title,
      thumbnail: wsState.mediaKind==='image' ? wsState.mediaBlobUrl : null,
      thumbIcon: TOOL_ICON_FALLBACK[tool.kind] || 'film',
      prompt: promptVal,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('users').doc(currentUser.uid).update({
      credits: firebase.firestore.FieldValue.increment(-cost)
    });
    setTimeout(()=>{
      toast('Generation complete');
      showView('home');
    }, 500);
  }catch(err){
    toast(err.message,'err');
  }
}

function openInsufficientCreditsModal(){
  bannerDismissed = false;
  openModal(`
    <div class="modal-icon-badge" style="background:rgba(255,84,112,.12);color:var(--danger)">${ICONS.coin}</div>
    <h3 style="margin:0 0 6px">Not enough credits</h3>
    <p style="font-size:13.5px;color:var(--muted);margin:0">Buy a plan to continue generating with Motion Ai.</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="closeModal();showView('credits')">Buy credits</button>
    </div>
  `);
}

/* ============================================================
   CREDITS / PLANS + PAYSTACK
   ============================================================ */
function renderPlans(){
  const list = document.getElementById('plansList');
  if(!list) return;
  list.innerHTML = CREDIT_PLANS.map(p=>`
    <div class="plan-card ${p.tag?'featured':''}">
      ${p.tag ? `<div class="plan-tag">${p.tag}</div>` : ''}
      <div class="plan-top">
        <div class="plan-name">${p.label}</div>
        <div class="plan-price">₦${p.price.toLocaleString()}</div>
      </div>
      <div class="plan-credits">${ICONS.coin}${p.credits.toLocaleString()} credits</div>
      <button class="btn btn-primary plan-cta" onclick="buyPlan('${p.id}')">Subscribe</button>
    </div>
  `).join('');
}
function buyPlan(planId){
  if(!currentUser){ toast('Sign in first','err'); return; }
  const plan = CREDIT_PLANS.find(p=>p.id===planId);
  if(!plan) return;
  if(!window.PaystackPop){ toast('Payment library failed to load','err'); return; }
  const handler = PaystackPop.setup({
    key: PAYSTACK_PUBLIC_KEY,
    email: currentUser.email,
    amount: plan.price * 100, // kobo
    currency: 'NGN',
    metadata: { plan: plan.id, uid: currentUser.uid },
    callback: function(response){
      confirmPurchase(plan, response.reference);
    },
    onClose: function(){ toast('Payment cancelled','err'); }
  });
  handler.openIframe();
}
async function confirmPurchase(plan, reference){
  try{
    const expiry = new Date();
    if(plan.id==='weekly') expiry.setDate(expiry.getDate()+7);
    else if(plan.id==='monthly') expiry.setMonth(expiry.getMonth()+1);
    else if(plan.id==='yearly') expiry.setFullYear(expiry.getFullYear()+1);
    else expiry.setFullYear(expiry.getFullYear()+50);

    await db.collection('users').doc(currentUser.uid).update({
      credits: firebase.firestore.FieldValue.increment(plan.credits),
      plan: plan.id,
      planExpiry: expiry,
      lastPaymentRef: reference
    });
    toast(`${plan.credits.toLocaleString()} credits added`);
    showView('home');
  }catch(err){ toast(err.message,'err'); }
}
